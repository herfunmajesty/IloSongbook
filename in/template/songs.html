<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">

<link rel="icon" href="/images/icon.PNG" sizes="32x32" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

<title>Krakow Ukulele & Sing Tuesdays - 7th Anniversary</title>

<style>
.highlight { background-color: lemonchiffon; font-weight: bold; }
.chord { font-weight: bold; color: red; }
ul { list-style: none; padding-left: 0; }
#options a { text-decoration: underline; }
#songs a { text-decoration: none; }

.montserrat-h3 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
}

/* --- Redesigned Pill-Style Toggle & Action Buttons --- */
.custom-btn {
    margin-bottom: 8px;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    transition: all 0.3s ease;
    display: inline-block;
    text-align: center;
    width: 100%;
}

.custom-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
}

/* Base Filter Styles (Inactive State) */
.btn-filter-easy {
    background-color: #e8f5e9;
    color: #198754;
    border: 2px solid #198754;
}
.btn-filter-easy.active {
    background: linear-gradient(135deg, #2ecc71, #198754);
    color: #ffffff !important;
    border-color: transparent;
}

.btn-filter-medium {
    background-color: #fffde7;
    color: #d97706;
    border: 2px solid #ffc107;
}
.btn-filter-medium.active {
    background: linear-gradient(135deg, #ffe082, #ffc107);
    color: #212529 !important;
    border-color: transparent;
}

.btn-filter-hard {
    background-color: #ffebee;
    color: #dc3545;
    border: 2px solid #dc3545;
}
.btn-filter-hard.active {
    background: linear-gradient(135deg, #ff7675, #dc3545);
    color: #ffffff !important;
    border-color: transparent;
}

.btn-filter-onlynew {
    background-color: #e0f7fa;
    color: #0891b2;
    border: 2px solid #0dcaf0;
}
.btn-filter-onlynew.active {
    background: linear-gradient(135deg, #67e8f9, #0dcaf0);
    color: #0f172a !important;
    border-color: transparent;
}

/* Sort Buttons */
.btn-sort {
    background-color: #f1f5f9;
    color: #334155;
    border: 2px solid #cbd5e1;
}
.btn-sort.active {
    background: linear-gradient(135deg, #38bdf8, #2563eb);
    color: #ffffff;
    border-color: transparent;
}

.bold-text {
    font-weight: bold;
    font-style: normal; 
}
.italic-text {
    font-style: italic;
    font-weight: normal;
}   
.ultra-light {
    font-family: 'Montserrat', sans-serif;
    font-weight: 200;
}

.semi-bold {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
}
.custom-text-h5 {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.2rem;
}

.lucky-button {
    margin-top: 4px;
    border: none;
    border-radius: 999px;
    padding: 8px 16px;
    background: linear-gradient(135deg, #ffe45e, #a855f7);
    background-size: 220% 220%;
    color: #231f20;
    font-weight: 600;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    animation: luckyShift 7s ease-in-out infinite;
    width: 100%;
    transition: transform 0.2s ease;
}

.lucky-button:hover {
    filter: brightness(1.05);
    transform: translateY(-1px);
}

@keyframes luckyShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.theme-toggle {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 2000;
    border: 1px solid #ced4da;
    border-radius: 999px;
    background-color: #ffffff;
    color: #212529;
    padding: 6px 12px;
    font-size: 0.875rem;
}

.theme-toggle:hover {
    background-color: #f8f9fa;
}

body {
    background-color: #ffffff;
    color: #212529;
    overflow-x: hidden;
}

body.dark-mode {
    background-color: #121212;
    color: #f1f1f1;
}

body.dark-mode a {
    color: #ff9a9a;
}

body.dark-mode a:focus,
body.dark-mode a:hover {
    color: #ffffff;
}

body.dark-mode .custom-btn.btn-sort {
    background-color: #1e293b;
    color: #cbd5e1;
    border-color: #475569;
}

body.dark-mode .theme-toggle {
    background-color: #1f1f1f;
    color: #f1f1f1;
    border-color: #595959;
}

body.dark-mode .lucky-button {
    background: linear-gradient(135deg, #ffd84d, #b084ff);
    background-size: 220% 220%;
    color: #111111;
}

/* --- Clean Anniversary Header Text --- */
.anniversary-header {
    margin: 10px auto 20px auto;
}

.anniversary-title {
    font-weight: 700;
    color: #db2777;
    letter-spacing: 0.5px;
    margin-bottom: 0;
    cursor: pointer;
    user-select: none;
    display: inline-block;
}

body.dark-mode .anniversary-title {
    color: #f472b6;
}

/* --- Natural Petal Shower Animation --- */
#petal-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    overflow: hidden;
    transition: opacity 0.4s ease;
}

#petal-container.off {
    opacity: 0;
    visibility: hidden;
}

.petal {
    position: absolute;
    top: -10%;
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 0.85;
    border-radius: 15px 0px 15px 0px;
    will-change: transform;
    animation: fall linear infinite;
}

/* Light Pink & Light Red Color Hues */
.petal.light-pink {
    background: linear-gradient(135deg, #fce7f3, #f472b6);
}

.petal.soft-rose {
    background: linear-gradient(135deg, #fbcfe8, #f43f5e);
}

.petal.light-red {
    background: linear-gradient(135deg, #ffe4e6, #f87171);
}

.petal.blush-pink {
    background: linear-gradient(135deg, #fff1f2, #fda4af);
}

@keyframes fall {
    0% {
        top: -10%;
        transform: translateX(0px) rotate(0deg);
        opacity: 0.85;
    }
    50% {
        opacity: 0.9;
    }
    100% {
        top: 105%;
        transform: translateX(var(--sway-x, 100px)) rotate(var(--sway-rot, 360deg));
        opacity: 0.15;
    }
}
</style>
</head>

<!-- Google tag (gtag.js) -->

<body>

<div id="petal-container"></div>

<button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">☼</button>

<header class="container text-center">
    <div class="m-2 mb-2 text-center">
        <img id="siteLogo" src="images/ukulele-krakow-trans-light.png" data-light-logo="images/ukulele-krakow-trans-light.png" data-dark-logo="images/ukulele-krakow-trans-dark.png" class="img-fluid" alt="Krakow Ukulele" width="200">
    </div>
    
    <!-- Clean Anniversary Header (Clickable Toggle) -->
    <div class="col-lg-8 col-md-10 col-sm-12 anniversary-header">
        <h5 id="anniversaryTitle" class="anniversary-title" title="Click to toggle petal animation on/off">Celebrating 7 Years of Strumming Together!</h5>
    </div>
</header>

<div class="container">
<div class="row justify-content-center">
    
    <div id="list" class="col-lg-8 col-md-10 col-sm-12 my-3">

        <h4 class="semi-bold mb-3">Songbook</h4>
        <div class="row row-cols-2">
            <div class="col-md-6">
                <div>
                    <h6 class="custom-text-h5 mb-2">Filter</h6>
                    <form id="filter-form">
                        <div class="d-flex flex-column">
                            <button type="button" name="Easy" class="custom-btn btn-filter-easy filter-button active">Easy</button>
                            <button type="button" name="Medium" class="custom-btn btn-filter-medium filter-button active">Medium</button>
                            <button type="button" name="Hard" class="custom-btn btn-filter-hard filter-button active">Hard</button>
                            <button type="button" name="New" class="custom-btn btn-filter-onlynew filter-button">🔥 New only</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-md-6 d-flex justify-content-end">
                <div class="w-100">
                    <h6 class="custom-text-h5 mb-2">Sort by</h6>
                    <div class="d-flex flex-column">
                        <button type="button" id="sortByTitle" class="custom-btn btn-sort active">Titles</button>
                        <button type="button" id="sortByArtist" class="custom-btn btn-sort">Artists</button>
                        <button type="button" id="luckyButton" class="lucky-button">I am feeling Lucky</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <h6>Songs</h6>
            <ul id="songs">
                {% for song in songs %}
                    <li data-title="{{song.Title}}" data-artist="{{song.Artist}}" data-level="{{song.Level}}">
                        <a href="{{song.html_name}}.html" name="{{song.Number}}">
                        {{song.Number}} - {{song.Title}} - 
                        </a>
                        <small>
                            <em> {{song.Artist}} - </em> 
                        </small>
                        <span class="text-{{song.l_tr}}" >
                            <small><b>{{song.Level}}</b></small>
                        </span>
                    </li>
                {% endfor %}
            </ul>
        </div>
       
    </div>

    <hr/>
            
    <div class="m-2 my-4 text-center">
        <img src="/images/qrcode.png" class="img-fluid" alt="QR Code" width="200">
    </div>

</div>
</div>

<script>
    // Theme Switcher (No storage)
    (function() {
        const toggleButton = document.getElementById('themeToggle');
        const logo = document.getElementById('siteLogo');

        function applyTheme(isDark) {
            document.body.classList.toggle('dark-mode', isDark);
            toggleButton.textContent = isDark ? '☾' : '☼';
            toggleButton.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            if (logo) {
                logo.src = isDark ? logo.dataset.darkLogo : logo.dataset.lightLogo;
            }
        }

        toggleButton.addEventListener('click', function() {
            applyTheme(!document.body.classList.contains('dark-mode'));
        });
    })();

    // Petal Shower Animation
    function setupPetalShower() {
        const container = document.getElementById('petal-container');
        const titleButton = document.getElementById('anniversaryTitle');
        if (!container || !titleButton) return;

        let petalsEnabled = true;

        function createPetals() {
            container.innerHTML = '';
            const colors = ['light-pink', 'soft-rose', 'light-red', 'blush-pink'];
            const petalCount = 32;
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const size = Math.random() * 10 + 10;
                const duration = Math.random() * 6 + 6;

                petal.classList.add('petal', randomColor);
                petal.style.width = `${size}px`;
                petal.style.height = `${size * 1.3}px`;
                petal.style.left = `${Math.random() * 100}vw`;

                petal.style.animationDuration = `${duration}s`;
                petal.style.animationDelay = `-${Math.random() * duration}s`;

                const swayX = (Math.random() - 0.5) * 260;
                const swayRot = Math.random() * 540 + 180;
                petal.style.setProperty('--sway-x', `${swayX}px`);
                petal.style.setProperty('--sway-rot', `${swayRot}deg`);

                fragment.appendChild(petal);
            }

            container.appendChild(fragment);
        }

        function updatePetalState() {
            if (petalsEnabled) {
                if (!container.children.length) createPetals();
                container.classList.remove('off');
            } else {
                container.classList.add('off');
            }
        }

        titleButton.addEventListener('click', () => {
            petalsEnabled = !petalsEnabled;
            updatePetalState();
        });

        updatePetalState();
    }

    // Shared Filtering Logic
    function filterSongs() {
        const songsList = document.getElementById('songs');
        if (!songsList) return;

        const activeButtons = document.querySelectorAll('.filter-button.active');
        const activeNames = Array.from(activeButtons).map(b => b.name);
        const allSongs = songsList.querySelectorAll('li');

        allSongs.forEach(song => {
            // Get level from data attribute or fallback to DOM text
            let level = song.getAttribute('data-level');
            if (!level) {
                const bTag = song.querySelector('span small b');
                level = bTag ? bTag.textContent.trim() : '';
            }

            let shouldDisplay = activeNames.includes(level);

            // Handle "New" Filter
            if (activeNames.includes('New')) {
                const titleText = song.querySelector('a')?.textContent || '';
                if (shouldDisplay) {
                    shouldDisplay = titleText.includes('🔥');
                }
            }

            song.style.display = shouldDisplay ? 'block' : 'none';
        });
    }

    function setupFilterButtons() {
        const filterButtons = document.querySelectorAll('.filter-button');

        filterSongs();

        filterButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                button.classList.toggle('active');
                filterSongs();
            });
        });
    }

    function setupSortingButtons() {
        const songsList = document.getElementById('songs');
        const sortByTitleButton = document.getElementById('sortByTitle');
        const sortByArtistButton = document.getElementById('sortByArtist');

        if (!songsList || !sortByTitleButton || !sortByArtistButton) return;

        sortByTitleButton.addEventListener('click', () => {
            sortListBy('title');
            sortByArtistButton.classList.remove('active');
            sortByTitleButton.classList.add('active');
            filterSongs();
        });

        sortByArtistButton.addEventListener('click', () => {
            sortListBy('artist');
            sortByTitleButton.classList.remove('active');
            sortByArtistButton.classList.add('active');
            filterSongs();
        });

        function sortListBy(type) {
            const items = Array.from(songsList.children);

            items.sort((a, b) => {
                let valA = '';
                let valB = '';

                if (type === 'title') {
                    valA = a.getAttribute('data-title') || a.querySelector('a')?.textContent || '';
                    valB = b.getAttribute('data-title') || b.querySelector('a')?.textContent || '';
                } else if (type === 'artist') {
                    valA = a.getAttribute('data-artist') || a.querySelector('em')?.textContent || '';
                    valB = b.getAttribute('data-artist') || b.querySelector('em')?.textContent || '';
                }

                // Clean prefixes for sorting
                valA = valA.replace(/^[🔥🎂\s\-\:]+/, '').replace(/^The\s+/i, '').trim();
                valB = valB.replace(/^[🔥🎂\s\-\:]+/, '').replace(/^The\s+/i, '').trim();

                return valA.localeCompare(valB, 'en', { sensitivity: 'base' });
            });

            // Re-append sorted elements
            const fragment = document.createDocumentFragment();
            items.forEach(item => fragment.appendChild(item));
            songsList.appendChild(fragment);
        }
    }

    function setupLuckyButton() {
        const luckyButton = document.getElementById('luckyButton');
        const songsList = document.getElementById('songs');

        if (!luckyButton || !songsList) return;

        luckyButton.addEventListener('click', () => {
            const visibleSongs = Array.from(songsList.querySelectorAll('li')).filter(song => song.style.display !== 'none');

            if (visibleSongs.length === 0) {
                alert('No songs match the current filter.');
                return;
            }

            const randomIndex = Math.floor(Math.random() * visibleSongs.length);
            const selectedSong = visibleSongs[randomIndex].querySelector('a');

            if (selectedSong && selectedSong.getAttribute('href')) {
                window.location.href = selectedSong.getAttribute('href');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setupFilterButtons();
        setupSortingButtons();
        setupLuckyButton();
        setupPetalShower();
    });
</script>
</body>
</html>
